<!doctype html>
<html lang="pt-PT">
    <head>
        <meta charset="UTF-8" />
        <meta name"description" content="entre em contacto com erica barros
         para proposta de estagio,
        projetos de desenvolvimento web ou esclarecimentod de duvida." />
        <meta name "author" content="Erica Barros" />
        <meta name="viewport" content="width=device-width",initial-scale=1.0" />

        <title>Portifolio|Meus Contactos</title>
        <link rel="stylesheet" href="css/style.css"/>
    </head>

    <body>
        <header>
            <h1>Meus Contactos</h1>

            <nav>
                <ul>
                    <li><a href="index.html">inicio</a></li>
                    <li><a href="projetos.html">projetos</a></li>
                    <li><a href="contactos.html">contactos</a></li>
                    </ul>
                    </nav>

                </header>
                <main>
                    <section>
                        <h2>envio uma mensagem</h2>
                        <p>
                            se preferir,pode enviar uma mensagem diretamente atraves do formulario abaixo:
                        </p>

                        <form action="#" method="get">
                            <fieldset>
                             <legend>informacao pessoais</legend>
                             
                             <div>
                                <label for="nome">nome</label><br>
                                <input type="text" name="nome" id="nome" placeholder="insira o seu nome"
                                required
                                />
                             </div><br>
                             <div>
                                <label for="email">email</label>
                                <input type="email" name="email" id="email" placeholder="insira o teu email"
                                required
                                />
                             </div><br>
                             <div>
                                <label for="telefone">telefone (opcional)</label><br>
                                <input type="tel" name="telefone" id="telefone" placeholder="(+238)000 00 00"
                                /> 
                             </div><br>
                            </fieldset>

                            <fieldset>
                                <legend>Motivos de contacto</legend>
                                <div>
                                    <label for="assunto">assunto</label><br>
                                    <select id="assunto" name="assunto" required>
                                        <option value="">--selecione uma opcao--</option>
                                        <option value="proposta de estagio">proposta de estagio</option>
                                        <option value="projetos ou colaboracoes">projetos ou colaboracoes</option>
                                        <option value="duvidas ou esclarecimentos">duvidas ou esclarecimentos</option>
                                    </select>

                                </div><br>

                                <div><br>
                                    <label for="mensagem">mensagem</label><br>
                                    <textarea id="mensagem" name="mensagem" placeholder="sua mensagem" rows="1" cols="20"
                                    required
                                    maxlength="255"

                                    ></textarea>
                                </div><br>

                                <div>
                                    <label for="resposta">como preferes receber a resposta?</label>

                                    <input type="radio" id ="resposta" name="resposta" value="telefone"
                                    checked
                                    />
                                    <label for="telefone">telefone</label>

                                    <input type="radio" id="email" name="resposta" value="email"
                                    />
                                    <label for="email">Email</label>
                                </div><br>

                                <div>
                                    <label for="autorizacao">autorizacao</label>

                                    <input type="checkbox" value="sim" id="autorizacao" name="autorizacao"
                                    required
                                    />
                                    <label>autoriza a utilizacao dos meus dados e aceito os termos de uso da plataforma!</label>

                                </div><br>


                            </fieldset>
                            <div>
                                <button type="submit">enviar mensagem</button>
                                <button type="reset">limpar formulario</button>
                            </div>
                            
                        </form>
                    </section>
                </main>
    </body>
 </html>
